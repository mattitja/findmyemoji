<!DOCTYPE html>
<html lang="{{LANG}}">
<head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>{{TITLE}}</title>
    <meta name="description" content="{{DESCRIPTION}}"/>
    <link rel="canonical" href="{{CANONICAL}}"/>
    {{HREFLANG_TAGS}}
    <meta property="og:type" content="website"/>
    <meta property="og:title" content="{{TITLE}}"/>
    <meta property="og:description" content="{{DESCRIPTION}}"/>
    <meta property="og:url" content="{{CANONICAL}}"/>
    <meta property="og:locale" content="{{OG_LOCALE}}"/>
    <meta property="og:image" content="https://whatsmoji.com/og-image.png"/>
    <meta name="twitter:card" content="summary_large_image"/>
    <script type="application/ld+json">{"@context":"https://schema.org","@type":"WebPage","name":"{{TITLE}}","url":"{{CANONICAL}}","inLanguage":"{{LANG}}"}</script>
    <link rel="icon" href="/favicon.ico"/>
    <meta name="theme-color" content="#faf9f6"/>
    <style>
        :root { --bg: #faf9f6; }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { overflow-y: scroll; }
        body {
            background: var(--bg);
            color: #111;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
        }

        .page {
            max-width: 52rem;
            margin: 0 auto;
            padding: 2rem 1.5rem 4rem;
        }

        .back-link {
            display: inline-block;
            font-size: 0.85rem;
            color: #bbb;
            text-decoration: none;
            margin-bottom: 2rem;
        }
        .back-link:hover { color: #888; }

        .emoji-hero {
            font-size: 6rem;
            line-height: 1;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.15s ease;
            user-select: none;
        }
        .emoji-hero:active { transform: scale(0.92); }
        @media (hover: hover) { .emoji-hero:hover { transform: scale(1.08); } }

        h1 {
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            margin-top: 1rem;
            line-height: 1.2;
        }

        .meaning {
            margin-top: 0.75rem;
            font-size: 1rem;
            color: #555;
            line-height: 1.6;
        }

        .codepoint {
            margin-top: 0.5rem;
            font-size: 0.8rem;
            color: #bbb;
            font-family: monospace;
        }

        .section-label {
            font-size: 0.7rem;
            font-weight: 600;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #bbb;
            margin-top: 2rem;
            margin-bottom: 0.5rem;
        }

        .pills {
            display: flex;
            flex-wrap: wrap;
            gap: 0.4rem;
        }
        .pill {
            font-size: 0.8rem;
            padding: 0.2rem 0.65rem;
            border-radius: 2rem;
            background: #f0ede8;
            color: #555;
        }
        .pill.secondary {
            background: transparent;
            border: 1px solid #e8e4dc;
            color: #bbb;
        }

        .related {
            display: flex;
            flex-wrap: wrap;
            gap: 0.15rem;
            margin-top: 0.5rem;
        }
        .related a {
            font-size: 2rem;
            text-decoration: none;
            display: inline-block;
            padding: 0.3rem;
            border-radius: 0.6rem;
            line-height: 1;
            transition: transform 0.12s ease, background 0.12s ease;
        }
        @media (hover: hover) {
            .related a:hover {
                transform: scale(1.35);
                background: rgba(0,0,0,0.04);
            }
        }

        #toast {
            position: fixed;
            left: 50%;
            transform: translateX(-50%) scale(0.8);
            background: rgba(20,20,20,0.85);
            color: #fff;
            padding: 0.55rem 1.1rem;
            border-radius: 2rem;
            font-size: 1rem;
            font-weight: 500;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease, transform 0.15s ease;
            white-space: nowrap;
            z-index: 100;
            backdrop-filter: blur(8px);
            bottom: 2rem;
        }
        #toast.visible {
            opacity: 1;
            transform: translateX(-50%) scale(1);
            animation: plop 0.3s cubic-bezier(0.34,1.5,0.64,1) forwards;
        }
        @keyframes plop {
            0%   { transform: translateX(-50%) scale(0.7); }
            60%  { transform: translateX(-50%) scale(1.08); }
            100% { transform: translateX(-50%) scale(1); }
        }

        footer {
            max-width: 52rem;
            margin: 0 auto;
            padding: 0 1.5rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        footer a {
            font-size: 0.75rem;
            color: #ccc;
            text-decoration: none;
        }
        footer a:hover { color: #999; }
    </style>
</head>
<body>

<div id="toast" aria-live="polite"></div>

<script>
let _toastTimer;
function copyEmoji(char) {
    navigator.clipboard.writeText(char);
    const t = document.getElementById('toast');
    t.textContent = char + ' {{COPIED_TEXT}}';
    t.classList.remove('visible');
    void t.offsetWidth;
    t.classList.add('visible');
    clearTimeout(_toastTimer);
    _toastTimer = setTimeout(() => t.classList.remove('visible'), 1400);
}
</script>

<div class="page">
    <a class="back-link" href="{{BACK_LINK_HREF}}">{{BACK_LINK_LABEL}}</a>

    <div>
        <span class="emoji-hero" onclick="copyEmoji('{{EMOJI}}')" title="{{H1_TEXT}}">{{EMOJI}}</span>
    </div>

    <h1>{{H1}}</h1>

    <p class="meaning">{{MEANING}}</p>

    <p class="codepoint">{{CODEPOINT}}</p>

    <p class="section-label">{{KEYWORDS_LABEL}}</p>
    <div class="pills">
        {{KEYWORDS_PRIMARY}}
        {{KEYWORDS_SECONDARY}}
    </div>

    <p class="section-label">{{RELATED_LABEL}}</p>
    <div class="related">
        {{RELATED_EMOJIS}}
    </div>
</div>

<footer>
    <a href="{{BACK_LINK_HREF}}">{{BACK_LINK_LABEL}}</a>
    <a href="{{LANG_SWITCH_HREF}}">{{LANG_SWITCH_LABEL}}</a>
</footer>

</body>
</html>
