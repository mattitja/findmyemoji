        // NFD decomposition strips combining diacritics: ü→u, ä→a, ö→o
        // so "mude" and "müde" both normalize to "mude" and match
        function normalize(str) {
            return str.normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ß/g, 'ss');
        }

        // pre-normalized keyword cache built once at startup
        const normalizedKeywords = emojis.map(e => e.keywords.map(normalize));

        function searchEmojis(query) {
            if (!query) return emojis;
            const words = normalize(query.toLowerCase().trim()).split(/\s+/);

            const scored = [];
            for (let i = 0; i < emojis.length; i++) {
                const emoji = emojis[i];
                const nkws = normalizedKeywords[i];
                let score = 0;
                for (const nkw of nkws) {
                    for (const word of words) {
                        if (nkw === word)              score += 100;
                        else if (nkw.startsWith(word)) score += 50;
                        else if (nkw.includes(word))   score += 10;
                    }
                }
                if (score > 0) scored.push({ emoji, score });
            }

            scored.sort((a, b) => b.score - a.score);
            return scored.map(x => x.emoji);
        }

        const RECENTS_KEY = 'fme_recents';
        const RECENTS_MAX = 12;

        function getRecents() {
            try { return JSON.parse(localStorage.getItem(RECENTS_KEY) || '[]'); }
            catch { return []; }
        }

        function addRecent(char) {
            const recents = [char, ...getRecents().filter(c => c !== char)].slice(0, RECENTS_MAX);
            localStorage.setItem(RECENTS_KEY, JSON.stringify(recents));
        }

        function renderRecents() {
            const recents = getRecents();
            const slot = document.getElementById('top-slot');
            const row = document.getElementById('recents');

            slot.classList.toggle('has-history', recents.length > 0);
            if (!recents.length) return;

            row.innerHTML = '';
            const frag = document.createDocumentFragment();
            for (const char of recents) {
                const span = document.createElement('span');
                span.textContent = char;
                span.className = 'emoji-item';
                frag.appendChild(span);
            }
            const btn = document.createElement('button');
            btn.id = 'recents-clear';
            btn.textContent = 'clear my history';
            frag.appendChild(btn);
            row.appendChild(frag);
        }

        function buildEmojiSpan(e) {
            const span = document.createElement("span");
            span.textContent = e.char;
            span.title = e.label;
            span.className = "emoji-item";
            return span;
        }

        function updateResults() {
            const query = document.getElementById("search").value.trim();
            const matches = searchEmojis(query);
            const container = document.getElementById("results");
            container.innerHTML = "";

            document.getElementById("count").textContent = query
                ? `${matches.length} result${matches.length === 1 ? '' : 's'} for "${query}"`
                : `${emojis.length} emojis`;

            const fragment = document.createDocumentFragment();
            for (const e of matches) {
                fragment.appendChild(buildEmojiSpan(e));
            }
            container.appendChild(fragment);
        }

        let toastTimer;
        function showToast(char, targetEl) {
            const toast = document.getElementById('toast');
            toast.textContent = `${char} copied`;
            toast.classList.remove('visible');

            // measure toast while invisible (opacity:0, not display:none)
            const tw = toast.offsetWidth;
            const th = toast.offsetHeight;
            const rect = targetEl.getBoundingClientRect();
            const margin = 10;
            const gap = 6;

            // center on emoji, clamped so toast never bleeds off screen
            const cx = rect.left + rect.width / 2;
            const left = Math.max(tw / 2 + margin, Math.min(window.innerWidth - tw / 2 - margin, cx));

            // above emoji unless too close to top, then below
            const top = rect.top - th - gap > margin ? rect.top - th - gap : rect.bottom + gap;

            toast.style.left = `${left}px`;
            toast.style.top = `${top}px`;
            toast.classList.add('visible');

            clearTimeout(toastTimer);
            toastTimer = setTimeout(() => toast.classList.remove('visible'), 1400);
        }

        function handleCopy(item) {
            const char = item.textContent;
            navigator.clipboard.writeText(char);
            addRecent(char);
            renderRecents();
            showToast(char, item);
            item.classList.add("copied");
            setTimeout(() => item.classList.remove("copied"), 700);
        }

        window.addEventListener("DOMContentLoaded", () => {
            document.getElementById("search").addEventListener("input", updateResults);

            document.getElementById("results").addEventListener("click", e => {
                const item = e.target.closest(".emoji-item");
                if (item) handleCopy(item);
            });

            document.getElementById("recents").addEventListener("click", e => {
                if (e.target.id === 'recents-clear') {
                    localStorage.removeItem(RECENTS_KEY);
                    renderRecents();
                    return;
                }
                const item = e.target.closest(".emoji-item");
                if (item) handleCopy(item);
            });

            renderRecents();
            updateResults();
        });
    </script>

            flex-wrap: wrap;
            gap: 0.15rem;
            contain: layout style; /* browser can skip off-screen subtree during scroll */
        }

        .emoji-item {
            font-size: 2rem;
            cursor: pointer;
            display: inline-block;
            padding: 0.3rem;
            border-radius: 0.6rem;
            transition: transform 0.12s ease, background 0.12s ease;
            user-select: none;
            touch-action: manipulation; /* no double-tap zoom delay on mobile */
            line-height: 1;
        }
        @media (hover: hover) {
            .emoji-item:hover {
                transform: scale(1.35);
                background: rgba(0,0,0,0.04);
            }
        }
        .emoji-item:active {
            transform: scale(1.2);
            background: rgba(0,0,0,0.06);
        }

        #top-slot {
            position: relative;
            max-width: 52rem;
            margin: 0 auto;
            height: 3.6rem; /* 0.75 + 2.6 + 0.25 — fixed so search bar never jumps */
            overflow: hidden;
        }

        /* wordmark and recents share the same absolute footprint */
        #wordmark,
        #recents-wrap {
            position: absolute;
            inset: 0;
            padding: 0.75rem 1rem 0.25rem;
            display: flex;
            align-items: center;
        }

        #wordmark {
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            color: #111;
            user-select: none;
            transition: transform 0.5s cubic-bezier(0.34, 1.15, 0.64, 1), opacity 0.35s ease;
        }
        #wordmark-tld {
            color: #bbb;
            font-weight: 400;
        }
        #top-slot.has-history #wordmark {
            transform: translateX(72%);
            opacity: 0.35;
        }

        #recents-wrap {
            opacity: 0;
            transform: translateX(-10px);
            pointer-events: none;
            transition: transform 0.5s cubic-bezier(0.34, 1.15, 0.64, 1), opacity 0.35s ease;
        }
        #top-slot.has-history #recents-wrap {
            opacity: 1;
            transform: translateX(0);
            pointer-events: auto;
        }
        #recents {
            display: flex;
            flex-wrap: nowrap;
            gap: 0.15rem;
            align-items: center;
            overflow: hidden;
            width: 100%;
        }
        #recents-clear {
            font-size: 0.72rem;
            color: #ccc;
            background: none;
            border: none;
            cursor: pointer;
            padding: 0.3rem 0.5rem;
            line-height: 1;
            white-space: nowrap;
            flex-shrink: 0;
        }
        #recents-clear:hover { color: #999; }

        #toast {
            position: fixed;
            transform: translateX(-50%);
            background: rgba(20, 20, 20, 0.82);
            color: #fff;
            padding: 0.4rem 0.9rem;
            border-radius: 2rem;
            font-size: 0.85rem;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.15s ease;
            white-space: nowrap;
            z-index: 100;
            backdrop-filter: blur(6px);
        }
        #toast.visible { opacity: 1; }

        @keyframes copy-flash {
            0%   { transform: scale(1);   filter: brightness(1); }
            35%  { transform: scale(1.65); filter: brightness(1.3) drop-shadow(0 0 8px rgba(167,139,250,0.7)); }
            100% { transform: scale(1);   filter: brightness(1); }
        }
        .emoji-item.copied { animation: copy-flash 0.7s cubic-bezier(.22,1,.36,1) forwards; }
    </style>
</head>
<body>

<div id="toast" aria-live="polite"></div>

<div id="sticky-header">
    <div id="top-slot">
        <div id="wordmark">whatsmoji<span id="wordmark-tld">.com</span></div>
        <div id="recents-wrap">
            <div id="recents"></div>
        </div>
    </div>
    <div id="search-header">
        <div class="inner">
            <input
                id="search"
                type="text"
                placeholder="e.g. smiley, cat, Fahrrad, Affe, rofl, :D..."
                autofocus
                autocomplete="off"
                autocorrect="off"
                spellcheck="false"
            />
            <p id="count"></p>
        </div>
    </div>
</div>

<div id="results-wrap">
    <div id="results"></div>
</div>

</body>
</html>
